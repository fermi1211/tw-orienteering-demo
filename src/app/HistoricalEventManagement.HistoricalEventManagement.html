@if(ui.editor){<ng-container [viewComponent]="ui.HistoricalEventEditor" [componentProps]="{initial:ui.editor.isNew?null:ui.editor,onSave:ui.save,onClose:handle('setEditor'),Dialog:ui.Dialog}"/>}@else{<div class="screen-toolbar"><p class="screen-muted">整理過往賽事，留下每一段探索的紀錄。</p><button class="screen-primary" (click)="ui.setEditor({isNew:true})"><demo-icon [props]="{name:'plus',size:20}"/>新增歷史賽事</button></div><div class="screen-filter-row"><label class="screen-field screen-search">搜尋賽事<input [value]="ui.search" (input)="ui.setSearch(field($event))" placeholder="賽事名稱或地點"/></label><label class="screen-field">發布狀態<select [formValue]="ui.filter" (change)="ui.setFilter(field($event))"><option value="all">全部</option><option value="DRAFT">草稿</option><option value="PUBLISHED">已發布</option></select></label></div>@if(ui.notice){<p class="screen-notice">{{ui.notice}}</p>}<div class="screen-table-scroll"><table class="screen-table"><thead><tr><th>賽事名稱</th><th>活動日期</th><th>地點</th><th>狀態</th><th>操作</th></tr></thead><tbody>@for(e of ui.shown;track e.id){<tr><td><b>{{e.name}}</b></td><td>{{shortDate(e.starts)}}</td><td>{{e.location}}</td><td><span class="screen-status-dot" [class.published]="e.status==='PUBLISHED'">{{e.status==='PUBLISHED'?'已發布':'草稿'}}</span></td><td class="screen-actions-cell"><button (click)="ui.setEditor(e)">編輯</button>@if(e.status==='PUBLISHED'){<button (click)="ui.onOpenPublic(e)">預覽</button>}</td></tr>}</tbody></table></div>}
