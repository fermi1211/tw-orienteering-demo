<div class="screen-form"><fieldset class="screen-radios"><legend>資料格式</legend><label><input type="radio" [name]="ui.kind" [checked]="ui.material.mode==='none'" (change)="ui.update({mode:'none'})"/>未提供</label><label><input type="radio" [name]="ui.kind" [checked]="ui.material.mode==='images'" (change)="ui.update({mode:'images'})"/>圖片上傳</label><label><input type="radio" [name]="ui.kind" [checked]="ui.material.mode==='table'" (change)="ui.update({mode:'table'})"/>填寫表格</label></fieldset>@if(ui.material.mode==='images'){<ng-container [viewComponent]="ui.EventAttachments" [componentProps]="{imagesOnly:true,imageLabel:ui.schema.title+'圖片',value:{images:ui.material.images,documents:[]},editor:true,Dialog:ui.Dialog,onChange:imageChange}"/>}@if(ui.material.mode==='table'){<label class="screen-check"><input type="checkbox" [checked]="ui.material.masked" (change)="ui.update({masked:checked($event)})"/>公開暱稱遮蔽部分文字</label><div class="screen-table-scroll"><table class="screen-table"><thead><tr>@for(c of ui.schema.columns;track c.key){<th>{{c.label}}</th>}<th>操作</th></tr></thead><tbody>@for(r of ui.material.rows;track r.id){<tr>@for(c of ui.schema.columns;track c.key){<td><input [type]="c.type||'text'" [attr.aria-label]="c.label" [value]="r[c.key]||''" (input)="ui.updateRow(r.id,c.key,field($event))"/></td>}<td><button class="screen-danger" (click)="removeMaterialRow(r.id)">移除</button></td></tr>}</tbody></table></div><button class="screen-secondary" (click)="addMaterialRow()"><demo-icon [props]="{name:'plus',size:20}"/>新增一列</button>}</div>
