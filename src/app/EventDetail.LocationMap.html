<ng-container [viewFragment]="view" [viewOwner]="this" [viewRevision]="fragments.size"/>

</ng-template>

</ng-template>

<ng-template viewAnchor="fragment6" let-c>
<ng-container [viewFragment]="c.v0" [viewOwner]="this" [viewRevision]="fragments.size"/><ng-container [viewFragment]="c.v1" [viewOwner]="this" [viewRevision]="fragments.size"/>
</ng-template>

<ng-template viewAnchor="fragment9" let-c>
<ng-container [viewComponent]="c.v0" [componentProps]="c.v1"/>
</ng-template>

</ng-template>
