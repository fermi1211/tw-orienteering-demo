<div class="screen-registration"><fieldset class="screen-registration-modes"><legend>報名模式</legend>@for(mode of ui.modes;track mode.id){<label><input type="radio" name="registration-mode" [checked]="ui.mode===mode.id" [disabled]="!!ui.props.editing" (change)="ui.setMode(mode.id)">{{mode.name}}</label>}</fieldset>@if(!ui.modes.length&&!ui.props.editing){<p class="screen-empty">目前未開放報名方式。</p>}@else if(ui.mode==='MULTI'){<ng-container [viewComponent]="ui.GroupRegistration" [componentProps]="merge(ui.props,{eventInfo:merge(ui.props.eventInfo,{divisionCatalog:ui.props.eventInfo?.divisionCatalog||ui.props.groupCatalog}),groups:ui.groups,feeOptions:ui.props.optionSets.registrationFees})"/>}@else{<ng-container [viewComponent]="ui.SingleRegistrationForm" [componentProps]="merge(ui.props,{feeOptions:ui.props.optionSets.registrationFees})"/>}</div>
