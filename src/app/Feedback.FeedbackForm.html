<ui-dialog [title]="ui.created?'回饋已送出（示意）':'意見回饋'" kicker="FEEDBACK" [close]="ui.onClose">@if(ui.created){<div class="screen-success"><demo-icon [props]="{name:'check-circle',size:58}"/><p>感謝您的回饋，我們會持續優化<br>台灣定向的體驗。</p><div class="screen-note">回饋編號　<strong>{{ui.issueNumber(ui.created)}}</strong></div><button class="screen-primary screen-full" (click)="ui.onClose()">我知道了</button></div>}@else{<p>您好，{{ui.memberNumber}}<br>感謝您的回饋，我們會持續優化台灣定向的體驗。</p><form class="screen-form" (submit)="ui.submit($event)" novalidate><label class="screen-field">類型<select [formValue]="ui.typeId" (change)="ui.setTypeId(field($event))"><option value="">請選擇回饋類型</option>@for(t of ui.activeTypes;track t.id){<option [value]="t.id">{{t.name}}</option>}</select>@if(ui.errors.typeId){<small class="screen-error">{{ui.errors.typeId}}</small>}</label><label class="screen-field">問題描述<textarea rows="5" placeholder="請詳細描述您的問題或建議……" [value]="ui.description" (input)="ui.setDescription(field($event))"></textarea><small class="screen-counter">{{ui.description.length}} / 1000</small></label>@if(ui.errors.description||ui.errors.submit){<p class="screen-error" role="alert">{{ui.errors.description||ui.errors.submit}}</p>}<div class="screen-actions"><button type="button" class="screen-secondary" (click)="ui.onClose()">取消</button><button type="submit" class="screen-primary">送出</button></div></form>}</ui-dialog>
