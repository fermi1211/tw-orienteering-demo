<article class="screen-journal-card"><button type="button" class="screen-cover-button" [attr.aria-label]="'閱讀：'+ui.article.title" (click)="ui.onRead(ui.article.id)">@if(ui.article.cover){<img [src]="ui.article.cover" [alt]="ui.article.coverAlt||ui.article.title">}</button><div class="screen-journal-card-copy"><div class="screen-journal-meta"><span>{{ui.optionName(ui.categories,ui.article.category)}}</span><time>{{ui.articleDate(ui.article.publishedAt)}}</time></div><h2><button (click)="ui.onRead(ui.article.id)">{{ui.article.title}}</button></h2><p>{{ui.article.excerpt}}</p><button class="screen-text-link" [attr.aria-label]="'繼續閱讀：'+ui.article.title" (click)="ui.onRead(ui.article.id)"><demo-icon [props]="{name:'arrow-right',size:21}"/></button></div></article>
