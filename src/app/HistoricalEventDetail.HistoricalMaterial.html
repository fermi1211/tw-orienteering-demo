@if(ui.material){<h2>{{ui.schema.title}}</h2>@if(ui.material.mode==='images'){<ng-container [viewComponent]="ui.EventImageGallery" [componentProps]="{images:ui.material.images,Dialog:ui.Dialog}"/>}@else{<div class="screen-table-scroll"><table class="screen-table"><thead><tr>@for(c of ui.columns;track c.key){<th>{{c.label}}</th>}</tr></thead><tbody>@for(r of ui.material.rows;track $index){<tr>@for(c of ui.columns;track c.key){<td>{{r[c.key]}}</td>}</tr>}</tbody></table></div>}}
