<div class="screen-editor-page"><div class="screen-title-row"><h2>{{ui.record.published?'編輯文章':'撰寫文章'}}</h2><button class="screen-secondary" (click)="requestBack()"><demo-icon [props]="{name:'arrow-left',size:20}"/>返回文章列表</button></div><div class="screen-tabs"><button [class.active]="ui.mode==='edit'" (click)="ui.setMode('edit')">編輯內容</button><button [class.active]="ui.mode==='preview'" (click)="previewOpen=true">文章預覽</button></div>@if(ui.error){<p class="screen-error">{{ui.error}}</p>}@if(ui.notice){<p class="screen-notice">{{ui.notice}}</p>}<div class="screen-composer-grid"><div class="screen-form"><label class="screen-field screen-article-title-input">文章標題<input maxlength="120" [value]="ui.draft.title" (input)="ui.change({title:field($event)})" placeholder="為這篇文章取個名字"/></label><div class="screen-two-fields"><label class="screen-field">分類<select [formValue]="ui.draft.category" (change)="ui.change({category:field($event)})">@for(c of ui.categories;track c.id){<option [value]="c.id" [disabled]="!c.active&&c.id!==ui.draft.category">{{c.name}}</option>}</select></label><label class="screen-field">作者<input [value]="ui.draft.author" (input)="ui.change({author:field($event)})"/></label></div><h3>文章內容</h3><ng-container [viewComponent]="ui.RichArticleEditor" [componentProps]="{initialContent:ui.draft.content,onChange:updateContent,onBusyChange:ui.setEditorBusy,Dialog:ui.Dialog}"/></div><aside class="screen-composer-rail screen-form"><h3>發布設定</h3><p class="screen-muted">{{ui.record.published?'已發布，可更新公開版本':'草稿尚未公開'}}</p><button class="screen-primary" (click)="ui.save(true)" [disabled]="ui.coverBusy||ui.editorBusy">{{ui.record.published?'發布更新':'發布文章'}} <demo-icon [props]="{name:'arrow-right',size:20}"/></button><button class="screen-secondary" (click)="ui.save(false)">儲存草稿</button><h3>文章摘要</h3><label class="screen-field">簡短介紹<textarea maxlength="220" rows="4" [value]="ui.draft.excerpt" (input)="ui.change({excerpt:field($event)})"></textarea><small>{{ui.draft.excerpt.length}} / 220</small></label><h3>封面圖片</h3>@if(ui.draft.cover){<img class="screen-cover-preview" [src]="ui.draft.cover" [alt]="ui.draft.coverAlt || '封面預覽'"/>}<label class="screen-upload">{{ui.coverBusy?'處理圖片中…':'選擇封面圖片'}}<input type="file" accept="image/jpeg,image/png" (change)="ui.chooseCover($event)" [disabled]="ui.coverBusy"/></label>@if(ui.draft.cover){<button class="screen-text-link" (click)="ui.change({cover:'',coverAlt:''})">移除封面</button>}<label class="screen-field">圖片替代文字<input [value]="ui.draft.coverAlt" (input)="ui.change({coverAlt:field($event)})"/></label></aside></div></div>
@if(ui.leaving){<ui-dialog title="離開文章編輯？" [close]="handle('setLeaving',false)"><p>尚未儲存的修改將會遺失。</p><div class="screen-actions"><button class="screen-secondary" (click)="ui.setLeaving(false)">繼續編輯</button><button class="screen-secondary" (click)="ui.save(false,true)">儲存後離開</button><button class="screen-primary" (click)="ui.onBack()">直接離開</button></div></ui-dialog>}
@if(previewOpen){<ui-dialog title="文章預覽" [wide]="true" [close]="closeComposerPreview"><p class="screen-note">預覽目前編輯內容；關閉後可繼續編輯。</p><ng-container [viewComponent]="ui.ArticleReadingSurface" [componentProps]="{article:ui.draft,categories:ui.categories,preview:true}"/><div class="screen-actions"><button type="button" class="screen-secondary" (click)="closeComposerPreview()">返回編輯</button></div></ui-dialog>}
