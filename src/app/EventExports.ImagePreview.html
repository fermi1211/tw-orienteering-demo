<div class="screen-image-preview">@if(ui.busy){<p class="screen-empty" role="status">正在產生圖片…</p>}@else if(ui.error){<p class="screen-error">{{ui.error}}</p>}@else if(ui.page){<img [src]="ui.page.url" [alt]="ui.kind==='entry'?'組別名單預覽':'出發序預覽'"/><div class="screen-preview-controls"><button class="icon-button" aria-label="上一頁" [disabled]="ui.pageIndex===0" (click)="ui.setIndex(ui.pageIndex-1)"><demo-icon [props]="{name:'caret-left',size:18}"/></button><span>{{ui.pageIndex+1}} / {{ui.pages.length}}</span><button class="icon-button" aria-label="下一頁" [disabled]="ui.pageIndex>=ui.pages.length-1" (click)="ui.setIndex(ui.pageIndex+1)"><demo-icon [props]="{name:'caret-right',size:18}"/></button></div><div class="screen-actions">@if(ui.disabled){<p class="screen-muted">完成資料與出發時間後即可下載</p>}@else{<a class="screen-primary" [href]="ui.page.url" [download]="ui.filename">下載 PNG <demo-icon [props]="{name:'download-simple',size:18}"/></a>}</div>}</div>
