<p class="screen-muted">依會員標籤管理名單；標注不會改變報名費用。</p><div class="screen-filter-row"><label class="screen-field screen-search">搜尋會員<input placeholder="姓名、暱稱或會員編號" [value]="ui.query" (input)="ui.setQuery(field($event))"/></label><label class="screen-field">標籤<select [formValue]="ui.filter" (change)="ui.setFilter(field($event))"><option value="">全部標籤</option><option value="none">尚未標注</option>@for(l of ui.labels;track l.id){<option [value]="l.id">{{l.name}}</option>}</select></label><button class="screen-secondary" (click)="setPanel('labels')">管理標籤</button></div>@if(ui.notice){<p class="screen-notice">{{ui.notice}}</p>}<div class="screen-table-scroll"><table class="screen-table"><thead><tr><th>會員編號</th><th>姓名</th><th>暱稱</th><th>目前標籤</th><th>操作</th></tr></thead><tbody>@for(m of ui.shown;track m.id){<tr><td>{{m.number}}</td><td>{{m.name}}</td><td>{{m.nickname}}</td><td><ng-container [viewComponent]="ui.MemberLabels" [componentProps]="{member:m,labels:ui.labels}"/></td><td class="screen-actions-cell"><button (click)="ui.setEditing(m)">編輯標注</button></td></tr>}</tbody></table></div>@if(ui.editing){<ng-container [viewComponent]="ui.LabelEditor" [componentProps]="{member:ui.editing,labels:ui.labels,Dialog:ui.Dialog,onSave:ui.save,onClose:handle('setEditing')}"/>}@if(panel==='labels'){<ui-dialog title="標籤管理" [wide]="true" [close]="closePanel"><p class="screen-muted">建立與管理會員標籤，只供分類使用，不決定費用資格。</p><ng-container [viewComponent]="ui.OptionParameters" [componentProps]="{value:props['optionSets'],onSave:props['onSaveOptions'],tab:'memberLabels',compact:true}"/><div class="screen-actions"><button class="screen-secondary" (click)="closePanel()">關閉</button></div></ui-dialog>}
