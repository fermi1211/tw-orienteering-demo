<p class="screen-muted">管理會員基本資料，報名紀錄保留建立時的資料。</p><div class="screen-filter-row"><label class="screen-field screen-search">搜尋會員<input placeholder="姓名、暱稱、Email、電話或會員編號" [value]="ui.q" (input)="ui.setQ(field($event))"/></label><label class="screen-field">身分類別<select [formValue]="ui.residency" (change)="ui.setResidency(field($event))"><option value="">全部</option><option value="DOMESTIC">本國人</option><option value="FOREIGN">外國人</option></select></label><label class="screen-field">角色<select [formValue]="ui.memberRole" (change)="ui.setMemberRole(field($event))"><option value="">全部</option>@for(r of ui.roles;track r.id){<option [value]="r.id">{{r.name}}</option>}</select></label></div><div class="screen-table-scroll"><table class="screen-table"><thead><tr><th>會員編號</th><th>姓名／暱稱</th><th>Email</th><th>聯絡電話</th><th>角色</th><th>身分類別</th><th>操作</th></tr></thead><tbody>@for(m of ui.visible;track m.id){<tr><td>{{m.number}}</td><td><b>{{m.name}}</b><small>{{m.nickname}}</small></td><td>{{m.email}}</td><td>{{m.phone}}</td><td>{{ui.roleName(ui.roles,m.role)}}</td><td>{{m.residency==='FOREIGN'?'外國人':'本國人'}}</td><td class="screen-actions-cell"><button (click)="ui.setEditing(m.id)">編輯</button></td></tr>}</tbody></table></div><p class="screen-count">共 {{ui.visible.length}} 位會員</p>@if(ui.person){<ng-container [viewComponent]="ui.MemberEditor" [componentProps]="{member:ui.person,roles:ui.roles,groups:ui.groups,Dialog:ui.Dialog,onClose:handle('setEditing'),onSave:ui.onSave}"/>}
