<ui-dialog title="編輯會員標注" [close]="ui.onClose"><p>{{ui.member.number}}　{{ui.member.name}}（{{ui.member.nickname}}）</p><div class="screen-check-stack">@for(l of ui.options;track l.id){<label class="screen-check"><input type="checkbox" [checked]="ui.selected.includes(l.id)" (change)="toggleList(ui.setSelected,ui.selected,l.id,checked($event))"/>{{l.name}} {{l.active?'':'（已停用）'}}</label>}</div><div class="screen-actions"><button class="screen-secondary" (click)="ui.onClose()">取消</button><button class="screen-primary" (click)="ui.onSave(ui.member,ui.selected);ui.onClose()">儲存標注</button></div></ui-dialog>
