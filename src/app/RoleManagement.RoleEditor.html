<ui-dialog [title]="ui.initial.isNew?'新增角色':'編輯角色權限'" [wide]="true" [close]="ui.onClose"><form class="screen-form" (submit)="ui.submit($event)"><div class="screen-two-fields"><label class="screen-field">角色名稱<input [value]="ui.draft.name" [disabled]="ui.draft.system" (input)="patch(ui.setDraft,ui.draft,'name',field($event))" required/></label><label class="screen-check"><input type="checkbox" [disabled]="ui.draft.system" [checked]="ui.draft.active" (change)="patch(ui.setDraft,ui.draft,'active',checked($event))"/>啟用此角色</label></div>@if(ui.draft.system){<p class="screen-note">系統保留角色有固定的存取範圍。</p>}<table class="screen-table screen-role-matrix"><thead><tr><th>區域</th><th>畫面</th><th>可使用</th></tr></thead><tbody>@for(page of ui.screenCatalog;track page.id){<tr><td>{{page.area}}</td><td>{{page.name}}</td><td><input type="checkbox" [attr.aria-label]="page.name" [checked]="ui.draft.screens.includes(page.id)" [disabled]="ui.draft.id==='ADMIN'||!ui.roleScreenAllowed(ui.draft.id,page)" (change)="patchList(ui.setDraft,ui.draft,'screens',page.id,checked($event))"/></td></tr>}</tbody></table>@if(ui.error){<p class="screen-error">{{ui.error}}</p>}<div class="screen-actions"><button type="button" class="screen-secondary" (click)="ui.onClose()">取消</button><button class="screen-primary">儲存權限</button></div></form></ui-dialog>
