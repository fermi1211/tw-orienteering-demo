<ui-dialog title="指派會員角色" [close]="ui.onClose"><form class="screen-form" (submit)="saveRoles($event)"><p><b>{{ui.member.name}}</b>　{{ui.member.number}}　{{ui.member.nickname}}</p><p class="screen-muted">可複選角色，權限會合併生效。</p><div class="screen-check-stack">@for(r of ui.options;track r.id){<label class="screen-check"><input type="checkbox" [checked]="ui.role.includes(r.id)" [disabled]="!r.active" (change)="toggleList(ui.setRole,ui.role,r.id,checked($event))"/>{{r.name}} {{r.active?'':'（已停用）'}}</label>}</div>@if(ui.error){<p class="screen-error">{{ui.error}}</p>}<div class="screen-actions"><button type="button" class="screen-secondary" (click)="ui.onClose()">取消</button><button class="screen-primary">儲存指派</button></div></form></ui-dialog>
