<ui-dialog title="編輯會員資料" [wide]="true" [close]="ui.onClose"><form class="screen-form" (submit)="ui.submit($event)" novalidate><p class="screen-muted">{{ui.member.number}}　｜　{{ui.roleName(ui.roles,ui.member.role)}}</p><div class="screen-two-fields">@for(f of list(ui.memberFieldLabels);track f.key){<label class="screen-field">{{f.value}}@if(f.key==='division'){<select [formValue]="ui.draft.division" (change)="ui.change('division',field($event))">@for(g of ui.divisionOptions;track g.code){<option [value]="g.code">{{g.name}}</option>}</select>}@else{<input [type]="f.key==='phone'||f.key==='emergencyPhone'?'tel':'text'" [value]="ui.draft[f.key]" [attr.inputmode]="f.key==='phone'||f.key==='emergencyPhone'?'numeric':null" [attr.pattern]="f.key==='phone'||f.key==='emergencyPhone'?'09[0-9]{8}':null" (input)="ui.change(f.key,field($event))" (blur)="validateContact(f.key)" [attr.aria-invalid]="!!ui.errors[f.key]" [attr.aria-describedby]="ui.errors[f.key]?'member-'+f.key+'-error':null"/>@if(f.key==='phone'||f.key==='emergencyPhone'){<small class="screen-contact-hint">09 開頭，共 10 位數字</small>}}@if(ui.errors[f.key]){<span class="screen-error" [id]="'member-'+f.key+'-error'">{{ui.errors[f.key]}}</span>}</label>}<label class="screen-field">Email<input disabled [value]="ui.member.email"/></label><label class="screen-field">身分類別<input disabled [value]="ui.member.residency==='FOREIGN'?'外國人':'本國人'"/></label></div><p class="screen-note"><demo-icon [props]="{name:'lock-simple',size:20}"/>Email 與身分類別建立後鎖定。</p>@if(ui.member.history?.length){<details><summary>檢視修改紀錄（{{ui.member.history.length}}）</summary>@for(h of ui.member.history;track h.id){<p class="screen-muted">{{h.time}}　{{h.fields.join('、')}}</p>}</details>}<div class="screen-actions"><button type="button" class="screen-secondary" (click)="ui.onClose()">取消</button><button class="screen-primary" [disabled]="!ui.dirty">儲存變更</button></div></form></ui-dialog>
