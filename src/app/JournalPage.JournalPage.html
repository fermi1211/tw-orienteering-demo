<main id="main" class="screen-page screen-journal">@if(ui.articleId){<p class="screen-breadcrumb"><button (click)="ui.onBack()">定向專欄</button>　/　文章閱讀</p>@if(byId(ui.articles,ui.articleId);as article){<ng-container [viewComponent]="ui.ArticleReadingSurface" [componentProps]="{article:article,categories:ui.categories}"/>}@else{<h1>文章尚未公開</h1><button class="screen-secondary" (click)="ui.onBack()">返回定向專欄</button>}}@else{<p class="screen-kicker">SPECIAL COLUMN</p><h1>定向專欄</h1><p class="screen-lead">上山，也走自己的路。<br>地圖、路徑與風景，以及在山野中學會的事。</p><div class="screen-toolbar"><nav class="screen-tabs"><button [class.active]="ui.category==='__all__'" (click)="ui.setCategory('__all__')">全部文章</button>@for(c of ui.categories;track c.id){@if(c.active){<button [class.active]="ui.category===c.id" (click)="ui.setCategory(c.id)">{{c.name}}</button>}}</nav><label class="screen-search"><demo-icon [props]="{name:'magnifying-glass',size:20}"/><input type="search" aria-label="搜尋專欄文章" placeholder="搜尋文章" [value]="ui.query" (input)="ui.setQuery(field($event))"></label></div><section class="screen-journal-grid screen-journal-rows">@for(article of ui.visible;track article.id){<ng-container [viewComponent]="ui.ArticleCard" [componentProps]="{categories:ui.categories,article:article,onRead:ui.onRead,featured:false}"/>}@empty{<p class="screen-empty">沒有符合條件的文章。</p>}</section>}</main>
