<dialog [elementBinding]="ui.ref" class="screen-dialog" [class.is-wide]="ui.wide" [attr.aria-labelledby]="ui.titleId" (cancel)="$event.preventDefault();ui.onClose()" (click)="$event.target===ui.ref.current?ui.onClose():null"><div class="screen-dialog-body"><header><div><p class="screen-kicker">{{ui.title.includes('報名')?'REGISTER':''}}</p><h2 [id]="ui.titleId">{{ui.title}}</h2></div><button type="button" class="icon-button" aria-label="關閉視窗" (click)="ui.onClose()"><demo-icon [props]="{name:'x',size:23}"/></button></header><ng-container [viewFragment]="ui.children" [viewOwner]="this" [viewRevision]="fragments.size"/></div></dialog>
