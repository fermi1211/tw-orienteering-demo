<div class="screen-visibility"><p class="screen-muted">各組報名人數固定顯示；公開資料僅包含暱稱、組別或出發時間。</p><div class="screen-two-fields"><section><label class="screen-check"><input type="checkbox" [checked]="ui.settings.registrations" (change)="ui.change('registrations',checked($event))"/>公開報名名單</label><label class="screen-check"><input type="checkbox" [disabled]="!ui.settings.registrations" [checked]="ui.settings.maskRegistrations" (change)="ui.change('maskRegistrations',checked($event))"/>名單暱稱隱碼</label></section><section><label class="screen-check"><input type="checkbox" [checked]="ui.settings.startOrder" (change)="ui.change('startOrder',checked($event))"/>公開出發序</label><label class="screen-check"><input type="checkbox" [disabled]="!ui.settings.startOrder" [checked]="ui.settings.maskStartOrder" (change)="ui.change('maskStartOrder',checked($event))"/>出發序暱稱隱碼</label></section></div><p class="screen-muted">隱碼範例：森林旅人 → 森**人。未填暱稱不以姓名替代。</p></div>
